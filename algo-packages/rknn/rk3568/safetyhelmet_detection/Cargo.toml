[package]
name = "safetyhelmet-detection-rk3568-rknn"
version = "1.0.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "safetyhelmet_detection"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "safetyhelmet_detection_run_local"
path = "src/bin/run_local.rs"

[features]
default = []
rga = ["algo-sdk/rga"]
# 开启后 run_local 构造 DMA-BUF / CVPixelBuffer 真实硬件帧；未开启则退化为步长对齐的 Host NV12 模拟帧。
testing-hardware = ["algo-sdk/testing-hardware"]

[dependencies]
algo-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
libloading = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
