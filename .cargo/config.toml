# ============================================================================
# Heimdall Cargo 构建配置
# ============================================================================

# 增量编译：关闭。
# 本项目 feature 组合频繁变化（infer: cpu/coreml/rknn/ascend, media: mpp/dvpp/rga），
# 增量缓存命中率极低，反而导致 target/debug/incremental 膨胀至数 GB。
# 由 sccache 接管跨命令缓存，实际编译速度无感知差异。
CARGO_INCREMENTAL = "0"

# sccache：跨命令编译缓存，消除 cargo clippy → cargo test 间的重复编译。
# 首次编译无增益；多次迭代后缓存命中率上升，效果显著。
# 临时禁用：export RUSTC_WRAPPER=""
RUSTC_WRAPPER = "sccache"

# ============================================================================
# 交叉编译（仅在 --target 指定时生效，不影响本机构建）
# ============================================================================

# Rockchip RK3576 / RK3588 / RK3568 ARM64 Linux
# 前置：cargo install cargo-zigbuild && cargo install zig
[target.aarch64-unknown-linux-gnu]
linker = "cargo-zigbuild"
