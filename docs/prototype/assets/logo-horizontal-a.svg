<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="hApertureRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="hIrisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#00F0FF"/>
      <stop offset="75%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#070D1A"/>
    </radialGradient>
    <linearGradient id="hTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- === 左侧图标区 (64x64 视界) === -->
  <g transform="translate(2, 0)">
    <!-- AI 目标检测 BBox 边界角标 -->
    <g stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <path d="M 8 16 L 8 8 L 16 8"/>
      <path d="M 48 8 L 56 8 L 56 16"/>
      <path d="M 56 48 L 56 56 L 48 56"/>
      <path d="M 16 56 L 8 56 L 8 48"/>
    </g>

    <!-- 外层光圈环 -->
    <circle cx="32" cy="32" r="21" stroke="url(#hApertureRing)" stroke-width="3"/>

    <!-- 旋转光圈刀片切线 -->
    <path d="M 32 11 L 38 18 M 53 32 L 46 38 M 32 53 L 26 46 M 11 32 L 18 26" 
          stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>

    <!-- 核心全视天眼：虹膜与中心白核 -->
    <circle cx="32" cy="32" r="9.5" fill="url(#hIrisGlow)"/>
    <circle cx="32" cy="32" r="3.5" fill="#FFFFFF"/>

    <!-- 十字瞄准准星 -->
    <line x1="19" y1="32" x2="23" y2="32" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="41" y1="32" x2="45" y2="32" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="32" y1="19" x2="32" y2="23" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="32" y1="41" x2="32" y2="45" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 告警小橙点 -->
    <circle cx="45" cy="19" r="2.5" fill="#F59E0B"/>
  </g>

  <!-- === 中间分割线 === -->
  <line x1="72" y1="18" x2="72" y2="46" stroke="#334155" stroke-width="1"/>

  <!-- === 右侧品牌标与副标 === -->
  <g transform="translate(84, 0)">
    <!-- 主标题：ARGUS -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" font-weight="800" letter-spacing="3" fill="url(#hTitleGrad)">
      ARGUS
    </text>
    
    <!-- 副标题：边缘 AI 视频网关 -->
    <text x="0" y="47" font-family="'JetBrains Mono', 'Space Mono', monospace" 
          font-size="8.5" font-weight="600" letter-spacing="1.8" fill="#00F0FF" opacity="0.85">
      EDGE AI VISION GATEWAY
    </text>

    <!-- 在线状态指示器 -->
    <circle cx="196" cy="27" r="3" fill="#10B981"/>
    <text x="204" y="30" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#10B981" letter-spacing="1">
      ONLINE
    </text>
  </g>
</svg>
