<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favWhale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- 高对比度深色微圆角底板 (适配浅色与暗色浏览器标签) -->
  <rect width="64" height="64" rx="15" fill="#0A0E17"/>
  <!-- 微弱的边框描边 -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" stroke="#1E293B" stroke-width="1.5"/>

  <!-- 1. 小鲸鱼几何简形 (强化粗线条与速度感) -->
  <!-- 鲸身 -->
  <path d="M 44 28 C 47 31, 46 36, 40 39 C 34 42, 27 42, 20 40 C 14 38, 9 35, 7 36 C 8 32, 12 30, 16 29 C 23 27, 31 25, 38 25 C 42 25, 43 27, 44 28 Z" 
        fill="url(#favWhale)"/>
  
  <!-- 背鳍 -->
  <path d="M 28 25 C 30 20, 34 17, 36 16 C 35 19, 34 23, 33 25 Z" 
        fill="#38BDF8"/>

  <!-- 尾鳍 -->
  <path d="M 8 36 C 5 33, 3 31, 2 32 C 3 35, 5 37, 7 38 Z" fill="#0284C7"/>
  <path d="M 8 37 C 5 40, 3 42, 2 41 C 4 39, 6 38, 8 38 Z" fill="#0369A1"/>

  <!-- 2. 核心天眼：光圈瞳孔 (Favicon 的第一视觉锚点) -->
  <circle cx="39" cy="31" r="7" fill="#0A0E17" stroke="#00F0FF" stroke-width="2.5"/>
  <circle cx="39" cy="31" r="3.2" fill="#00F0FF"/>
  <circle cx="39" cy="31" r="1.2" fill="#FFFFFF"/>

  <!-- 3. 前方声呐雷达探测波 (极简 2 道，保证 16px 依然清晰可辨) -->
  <path d="M 48 24 C 52 28, 52 34, 48 38" 
        stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 54 20 C 59 26, 59 36, 54 42" 
        stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.8"/>
</svg>
