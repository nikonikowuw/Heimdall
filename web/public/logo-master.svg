<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 主光圈极光渐变 -->
    <linearGradient id="apertureRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- 叶片高光渐变 -->
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="bladeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.2"/>
    </linearGradient>

    <!-- 瞳孔核心发光 -->
    <radialGradient id="irisCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#00F0FF"/>
      <stop offset="65%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#070D1A"/>
    </radialGradient>

    <!-- 镜片深层反光 -->
    <radialGradient id="lensReflect" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0B1329" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </radialGradient>

    <!-- 霓虹辉光滤镜 -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="ambientShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#00F0FF" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- === 1. 目标检测边界框角标 (AI Bounding Box Corner Brackets) === -->
  <g stroke="#00F0FF" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#neonFilter)">
    <!-- 左上角标 -->
    <path d="M 64 128 L 64 64 L 128 64"/>
    <!-- 右上角标 -->
    <path d="M 384 64 L 448 64 L 448 128"/>
    <!-- 右下角标 -->
    <path d="M 448 384 L 448 448 L 384 448"/>
    <!-- 左下角标 -->
    <path d="M 128 448 L 64 448 L 64 384"/>
  </g>

  <!-- === 2. 外围环形刻度与雷达天线测距环 === -->
  <g filter="url(#ambientShadow)">
    <circle cx="256" cy="256" r="186" stroke="#1E293B" stroke-width="2"/>
    <circle cx="256" cy="256" r="186" stroke="url(#apertureRingGrad)" stroke-width="3" stroke-dasharray="16 12" opacity="0.6"/>

    <!-- 4 个方向主坐标刻度卡槽 -->
    <line x1="256" y1="56" x2="256" y2="76" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" filter="url(#neonFilter)"/>
    <line x1="256" y1="436" x2="256" y2="456" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" filter="url(#neonFilter)"/>
    <line x1="56" y1="256" x2="76" y2="256" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" filter="url(#neonFilter)"/>
    <line x1="436" y1="256" x2="456" y2="256" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" filter="url(#neonFilter)"/>

    <!-- 次级角度微刻度 (45度方向) -->
    <line x1="115" y1="115" x2="127" y2="127" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="397" y1="115" x2="385" y2="127" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="397" y1="397" x2="385" y2="385" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="115" y1="397" x2="127" y2="385" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- 主光圈基座外环 -->
    <circle cx="256" cy="256" r="162" fill="url(#lensReflect)" stroke="url(#apertureRingGrad)" stroke-width="5"/>
  </g>

  <!-- === 3. 机械光圈叶片群 (6-Blade Precision Aperture Assembly) === -->
  <g id="apertureBlades" transform="translate(256, 256)">
    <path d="M 0 -162 C 65 -162, 125 -125, 148 -68 L 52 -30 C 35 -58, 5 -75, -28 -72 Z" fill="url(#bladeGrad1)" stroke="#00F0FF" stroke-width="1.5"/>
    <g transform="rotate(60)">
      <path d="M 0 -162 C 65 -162, 125 -125, 148 -68 L 52 -30 C 35 -58, 5 -75, -28 -72 Z" fill="url(#bladeGrad2)" stroke="#00F0FF" stroke-width="1.5"/>
    </g>
    <g transform="rotate(120)">
      <path d="M 0 -162 C 65 -162, 125 -125, 148 -68 L 52 -30 C 35 -58, 5 -75, -28 -72 Z" fill="url(#bladeGrad1)" stroke="#00F0FF" stroke-width="1.5"/>
    </g>
    <g transform="rotate(180)">
      <path d="M 0 -162 C 65 -162, 125 -125, 148 -68 L 52 -30 C 35 -58, 5 -75, -28 -72 Z" fill="url(#bladeGrad2)" stroke="#00F0FF" stroke-width="1.5"/>
    </g>
    <g transform="rotate(240)">
      <path d="M 0 -162 C 65 -162, 125 -125, 148 -68 L 52 -30 C 35 -58, 5 -75, -28 -72 Z" fill="url(#bladeGrad1)" stroke="#00F0FF" stroke-width="1.5"/>
    </g>
    <g transform="rotate(300)">
      <path d="M 0 -162 C 65 -162, 125 -125, 148 -68 L 52 -30 C 35 -58, 5 -75, -28 -72 Z" fill="url(#bladeGrad2)" stroke="#00F0FF" stroke-width="1.5"/>
    </g>
  </g>

  <!-- === 4. 核心瞳孔与全视天眼 === -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="76" fill="#060A14" stroke="#00F0FF" stroke-width="3" filter="url(#neonFilter)"/>
    <circle cx="0" cy="0" r="62" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 8" opacity="0.75"/>
    <circle cx="0" cy="0" r="42" fill="url(#irisCoreGlow)"/>
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" filter="url(#neonFilter)"/>
    <circle cx="0" cy="0" r="6" fill="#00F0FF"/>

    <!-- === 5. 高精度对焦十字准星 === -->
    <line x1="-96" y1="0" x2="-56" y2="0" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" filter="url(#neonFilter)"/>
    <line x1="56" y1="0" x2="96" y2="0" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" filter="url(#neonFilter)"/>
    <line x1="0" y1="-96" x2="0" y2="-56" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" filter="url(#neonFilter)"/>
    <line x1="0" y1="56" x2="0" y2="96" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" filter="url(#neonFilter)"/>

    <line x1="-24" y1="0" x2="-14" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="0" x2="24" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="-24" x2="0" y2="-14" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="0" y2="24" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 越界告警指示灯 -->
    <circle cx="58" cy="-58" r="8" fill="#F59E0B" filter="url(#outerGlow)"/>
    <circle cx="58" cy="-58" r="4" fill="#FEF3C7"/>
  </g>
</svg>
