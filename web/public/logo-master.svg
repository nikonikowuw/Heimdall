<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- 工业纯黑圆角底盘 -->
  <rect width="512" height="512" rx="128" fill="#0A0D14"/>
  <rect x="2" y="2" width="508" height="508" rx="126" stroke="#1E2433" stroke-width="4"/>

  <!-- 4 个精致优雅的连续曲率取景检测框 (AI BBox Corners) -->
  <path d="M 128 208 C 128 152, 152 128, 208 128" 
        stroke="#00F0FF" stroke-width="28" stroke-linecap="round"/>
  <path d="M 304 128 C 360 128, 384 152, 384 208" 
        stroke="#00F0FF" stroke-width="28" stroke-linecap="round"/>
  <path d="M 384 304 C 384 360, 360 384, 304 384" 
        stroke="#00F0FF" stroke-width="28" stroke-linecap="round"/>
  <path d="M 208 384 C 152 384, 128 360, 128 304" 
        stroke="#00F0FF" stroke-width="28" stroke-linecap="round"/>

  <!-- 核心全视天眼 (Heimdall Pure Pupil) -->
  <circle cx="256" cy="256" r="48" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="20" fill="#0A0D14"/>
</svg>
