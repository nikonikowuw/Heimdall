<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .bg { fill: #090D16; stroke: #1E293B; }
    .bracket { stroke: #00F0FF; }
    .core-outer { fill: #FFFFFF; }
    .core-inner { fill: #090D16; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #F1F5F9; stroke: #CBD5E1; }
      .bracket { stroke: #0284C7; }
      .core-outer { fill: #0F172A; }
      .core-inner { fill: #F1F5F9; }
    }
  </style>

  <!-- 自适应底板 (暗色深底，亮色浅灰底带描边) -->
  <rect width="64" height="64" rx="16" class="bg" stroke-width="1.5"/>
  
  <!-- 4 个取景锁定角标 -->
  <path d="M 16 26 C 16 19, 19 16, 26 16" class="bracket" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 38 16 C 45 16, 48 19, 48 26" class="bracket" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 48 38 C 48 45, 45 48, 38 48" class="bracket" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 26 48 C 19 48, 16 45, 16 38" class="bracket" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 核心天眼 -->
  <circle cx="32" cy="32" r="6" class="core-outer"/>
  <circle cx="32" cy="32" r="2.5" class="core-inner"/>
</svg>
